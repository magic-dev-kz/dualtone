<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DualTone — One color in. Full system out.</title>
<link rel="manifest" href="manifest.json">
<meta property="og:title" content="DualTone — Light & Dark Palette Generator">
<meta property="og:description" content="Generate accessible color palettes for light and dark themes. WCAG contrast checker built in.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="DualTone — Light & Dark Palette Generator">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--font-ui:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
--font-mono:'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;
--radius-sm:6px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;
--transition-fast:150ms cubic-bezier(0.4,0,0.2,1);--transition-normal:250ms cubic-bezier(0.4,0,0.2,1);--transition-slow:400ms cubic-bezier(0.4,0,0.2,1);
--glass-blur:blur(20px);--glass-saturate:saturate(180%);
/* Dark theme (default) */
--bg-base:#0f0f1a;--bg-surface:rgba(255,255,255,0.05);--bg-surface-hover:rgba(255,255,255,0.09);
--bg-elevated:rgba(255,255,255,0.07);--border-color:rgba(255,255,255,0.08);
--text-primary:rgba(255,255,255,0.95);--text-secondary:rgba(255,255,255,0.65);
--text-tertiary:rgba(255,255,255,0.45);
--accent:#a78bfa;--accent-hover:#c4b5fd;--accent-dim:rgba(167,139,250,0.12);
--shadow-sm:0 1px 3px rgba(0,0,0,0.4),0 1px 2px rgba(0,0,0,0.3);
--shadow-md:0 4px 16px rgba(0,0,0,0.5),0 2px 6px rgba(0,0,0,0.3);
--shadow-lg:0 12px 48px rgba(0,0,0,0.6),0 4px 16px rgba(0,0,0,0.4);
--shadow-glow:0 0 30px rgba(167,139,250,0.15);
--gradient-hero:linear-gradient(135deg,rgba(167,139,250,0.15) 0%,rgba(236,72,153,0.10) 50%,rgba(99,102,241,0.08) 100%);
--success:#4ade80;--warning:#fbbf24;--error:#f87171;--info:#60a5fa;
}
[data-theme="light"]{
--bg-base:#f0f0f5;--bg-surface:rgba(255,255,255,0.65);--bg-surface-hover:rgba(255,255,255,0.85);
--bg-elevated:rgba(255,255,255,0.80);--border-color:rgba(0,0,0,0.08);
--text-primary:rgba(0,0,0,0.90);--text-secondary:rgba(0,0,0,0.55);
--text-tertiary:rgba(0,0,0,0.40);
--accent:#7c3aed;--accent-hover:#6d28d9;--accent-dim:rgba(124,58,237,0.08);
--shadow-sm:0 1px 3px rgba(0,0,0,0.07),0 1px 2px rgba(0,0,0,0.04);
--shadow-md:0 4px 16px rgba(0,0,0,0.10),0 2px 6px rgba(0,0,0,0.06);
--shadow-lg:0 12px 48px rgba(0,0,0,0.14),0 4px 16px rgba(0,0,0,0.08);
--shadow-glow:0 0 30px rgba(124,58,237,0.08);
--gradient-hero:linear-gradient(135deg,rgba(124,58,237,0.08) 0%,rgba(236,72,153,0.06) 50%,rgba(99,102,241,0.04) 100%);
--success:#16a34a;--warning:#d97706;--error:#dc2626;--info:#2563eb;
}
html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:var(--font-ui);
background:var(--gradient-hero),radial-gradient(ellipse 60% 40% at 80% 10%,rgba(236,72,153,0.06),transparent),radial-gradient(ellipse 50% 50% at 20% 80%,rgba(99,102,241,0.06),transparent),var(--bg-base);
color:var(--text-primary);min-height:100vh;line-height:1.55;letter-spacing:-0.01em;
transition:background 500ms cubic-bezier(0.4,0,0.2,1),color var(--transition-normal)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;
animation-iteration-count:1!important;transition-duration:0.01ms!important}}

/* Hero */
.hero{display:flex;align-items:center;justify-content:space-between;padding:56px 32px 48px;
max-width:1400px;margin:0 auto;gap:48px;transition:all 500ms cubic-bezier(0.4,0,0.2,1);overflow:hidden}
.hero-content{flex:1;min-width:0}
.hero-title{font-size:2.75rem;font-weight:800;letter-spacing:-0.04em;line-height:1.1;
color:var(--text-primary);margin:0}
.hero-accent{background:linear-gradient(135deg,var(--accent) 0%,#ec4899 40%,#f59e0b 100%);-webkit-background-clip:text;
-webkit-text-fill-color:transparent;background-clip:text;background-size:200% 200%;
animation:gradientShift 6s ease infinite}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero-subtitle{font-size:1.05rem;color:var(--text-secondary);line-height:1.7;max-width:480px;margin-top:14px;
font-weight:400;transition:opacity 400ms ease,max-height 400ms ease}
.hero-cta{display:flex;align-items:center;gap:16px;margin-top:28px}
.hero-picker-wrap{position:relative;width:80px;height:80px;border-radius:16px;overflow:hidden;
border:3px solid var(--border-color);flex-shrink:0;box-shadow:var(--shadow-md);
transition:all var(--transition-fast)}
.hero-picker-wrap:hover{box-shadow:var(--shadow-lg);transform:scale(1.05)}
.hero-picker-wrap input[type="color"]{position:absolute;inset:-4px;width:calc(100% + 8px);
height:calc(100% + 8px);border:none;cursor:pointer;background:none}
.hero-or{font-size:0.85rem;color:var(--text-tertiary);font-weight:500}
.hero-random-btn{padding:14px 28px;border-radius:12px;border:none;background:var(--accent);
color:#fff;font-weight:600;font-size:1rem;cursor:pointer;transition:all 300ms cubic-bezier(0.4,0,0.2,1);
box-shadow:0 0 24px rgba(167,139,250,0.3);font-family:var(--font-ui);position:relative;overflow:hidden}
.hero-random-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 30%,rgba(255,255,255,0.15) 50%,transparent 70%);
transform:translateX(-100%);transition:transform 400ms ease}
.hero-random-btn:hover{box-shadow:0 0 40px rgba(167,139,250,0.5);transform:translateY(-2px) scale(1.02)}
.hero-random-btn:hover::before{transform:translateX(100%)}
.hero-random-btn:active{transform:translateY(0) scale(0.98)}
.hero-visual{display:flex;flex-direction:column;gap:8px;width:320px;flex-shrink:0}
.hero-strip{height:32px;border-radius:8px;display:flex;overflow:hidden;box-shadow:var(--shadow-sm)}
.hero-strip-cell{flex:1;transition:background 600ms ease}
.hero.collapsed{padding:16px 24px}
.hero.collapsed .hero-subtitle,.hero.collapsed .hero-visual,.hero.collapsed .hero-cta{
opacity:0;max-height:0;margin:0;padding:0;overflow:hidden;pointer-events:none}
.hero.collapsed .hero-title{font-size:1.25rem}
@media(max-width:768px){
.hero{flex-direction:column;text-align:center;padding:32px 16px}
.hero-title{font-size:1.8rem}
.hero-visual{width:100%}
.hero-subtitle{max-width:100%}
.hero-cta{justify-content:center}
}

/* Skip to content */
.skip-to-content{position:absolute;top:-100%;left:50%;transform:translateX(-50%);
padding:8px 16px;background:var(--accent);color:#fff;border-radius:var(--radius-sm);
z-index:10000;font-size:0.85rem;font-weight:600;text-decoration:none;
transition:top var(--transition-fast)}
.skip-to-content:focus{top:8px}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:3px}

/* Header — Glassmorphism */
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;
border-bottom:1px solid var(--border-color);background:var(--bg-surface);
backdrop-filter:var(--glass-blur) var(--glass-saturate);-webkit-backdrop-filter:var(--glass-blur) var(--glass-saturate)}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{font-size:1.25rem;font-weight:800;letter-spacing:-0.03em;line-height:1}
.logo-icon{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ec4899);
flex-shrink:0;box-shadow:0 0 12px rgba(167,139,250,0.3);animation:logoPulse 3s ease-in-out infinite}
@keyframes logoPulse{0%,100%{box-shadow:0 0 12px rgba(167,139,250,0.3)}50%{box-shadow:0 0 20px rgba(167,139,250,0.5)}}
.header-actions{display:flex;align-items:center;gap:12px}
.theme-toggle{background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-sm);
padding:6px 12px;color:var(--text-primary);cursor:pointer;font-size:0.8rem;font-family:var(--font-ui);font-weight:500;
transition:all var(--transition-fast);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.theme-toggle:hover{background:var(--bg-surface-hover);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.share-btn{background:var(--accent);border:none;border-radius:var(--radius-sm);
padding:8px 16px;color:#fff;cursor:pointer;font-size:0.8rem;font-weight:600;font-family:var(--font-ui);
transition:all 300ms cubic-bezier(0.4,0,0.2,1);box-shadow:0 0 20px rgba(167,139,250,0.25)}
.share-btn:hover{box-shadow:0 0 32px rgba(167,139,250,0.45);transform:translateY(-2px)}

/* Sticky Input Bar — Glassmorphism */
.input-bar{position:sticky;top:0;z-index:100;padding:12px 24px;
background:var(--bg-surface);border-bottom:1px solid var(--border-color);
display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px;
backdrop-filter:var(--glass-blur) var(--glass-saturate);-webkit-backdrop-filter:var(--glass-blur) var(--glass-saturate);
box-shadow:var(--shadow-sm)}
.color-picker-wrap{position:relative;width:56px;height:56px;border-radius:12px;
overflow:hidden;border:2px solid var(--border-color);flex-shrink:0;
box-shadow:var(--shadow-sm);transition:all 300ms cubic-bezier(0.4,0,0.2,1)}
.color-picker-wrap:hover{box-shadow:var(--shadow-md);transform:scale(1.08)}
.color-picker-wrap input[type="color"]{position:absolute;inset:-4px;width:calc(100% + 8px);
height:calc(100% + 8px);border:none;cursor:pointer;background:none}
.hex-input-wrap{display:flex;flex-direction:column;position:relative}
.hex-input{width:120px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-color);
background:var(--bg-surface);color:var(--text-primary);font-family:var(--font-mono);font-size:0.9rem;
text-transform:uppercase;outline:none;transition:all var(--transition-normal);
backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.hex-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.hex-input.hex-error{border-color:var(--error);animation:shake 300ms ease}
.hex-error-msg{font-size:0.7rem;color:var(--error);margin-top:2px;display:none}
.hex-error-msg.visible{display:block}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.harmony-select{padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-color);
background:var(--bg-surface);color:var(--text-secondary);font-family:var(--font-ui);font-size:0.8rem;
outline:none;cursor:pointer;opacity:0.85;transition:opacity var(--transition-fast)}
.harmony-select:hover,.harmony-select:focus{opacity:1;border-color:var(--accent);color:var(--text-primary)}
.random-btn{padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--accent);
background:linear-gradient(135deg,var(--accent-dim),rgba(236,72,153,0.1));color:var(--accent);
cursor:pointer;font-family:var(--font-ui);font-size:0.8rem;font-weight:600;
transition:all 300ms cubic-bezier(0.4,0,0.2,1)}
.random-btn:hover{background:var(--accent);color:#fff;transform:translateY(-1px);
box-shadow:0 0 20px rgba(167,139,250,0.3)}
.random-btn:active{transform:scale(0.96)}

/* Main Content */
.main{max-width:1400px;margin:0 auto;padding:24px}

/* Section Titles — Enhanced Hierarchy */
.section-title{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.10em;
color:var(--text-secondary);margin-bottom:20px;display:flex;align-items:center;gap:10px}
.section-title::before{content:'';width:3px;height:16px;border-radius:2px;
background:linear-gradient(180deg,var(--accent),#ec4899);flex-shrink:0}

/* Palette Grid */
.palette-section{margin-bottom:32px}
.palette-row{margin-bottom:24px}
.palette-label{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.palette-label-text{font-size:0.8rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase;
letter-spacing:0.06em}
.palette-label-badge{font-size:0.65rem;padding:2px 6px;border-radius:4px;background:var(--accent-dim);
color:var(--accent);font-weight:500}
.swatches{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.swatch{aspect-ratio:1;border-radius:var(--radius-md);cursor:pointer;position:relative;
transition:transform 300ms cubic-bezier(0.34,1.56,0.64,1),box-shadow 300ms cubic-bezier(0.4,0,0.2,1);
border:1px solid rgba(0,0,0,0.06);display:flex;flex-direction:column;align-items:center;
justify-content:flex-end;padding:4px;overflow:hidden}
.swatch:hover{transform:scale(1.18) translateY(-4px);
box-shadow:var(--shadow-lg),0 0 0 2px var(--bg-base),0 0 0 3px currentColor,0 0 24px currentColor;z-index:10}
.swatch:active{transform:scale(1.05) translateY(-1px);transition-duration:100ms}
.swatch:focus-visible .swatch-hex{opacity:0.9}
.swatch-step{font-size:0.55rem;font-weight:700;opacity:0.85;pointer-events:none;
text-shadow:0 1px 3px rgba(0,0,0,0.4)}
.swatch-hex{font-size:0.5rem;font-family:var(--font-mono);opacity:0;pointer-events:none;
transition:opacity var(--transition-normal),transform var(--transition-normal);transform:translateY(4px);
text-shadow:0 1px 3px rgba(0,0,0,0.4)}
.swatch:hover .swatch-hex{opacity:0.95;transform:translateY(0)}
.swatch.copied::after{content:'Copied!';position:absolute;inset:0;display:flex;align-items:center;
justify-content:center;background:rgba(0,0,0,0.6);color:#fff;font-size:0.7rem;font-weight:600;
border-radius:var(--radius-md);animation:copiedFade 800ms ease forwards;backdrop-filter:blur(4px)}
@keyframes copiedFade{0%{opacity:1;transform:scale(1)}40%{transform:scale(1.05)}70%{opacity:1}100%{opacity:0;transform:scale(1)}}
/* Palette generation animation */
@keyframes swatchAppear{0%{opacity:0;transform:scale(0.6) translateY(8px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.swatch{animation:swatchAppear 400ms cubic-bezier(0.34,1.56,0.64,1) both}
.swatches .swatch:nth-child(1){animation-delay:20ms}
.swatches .swatch:nth-child(2){animation-delay:40ms}
.swatches .swatch:nth-child(3){animation-delay:60ms}
.swatches .swatch:nth-child(4){animation-delay:80ms}
.swatches .swatch:nth-child(5){animation-delay:100ms}
.swatches .swatch:nth-child(6){animation-delay:120ms}
.swatches .swatch:nth-child(7){animation-delay:140ms}
.swatches .swatch:nth-child(8){animation-delay:160ms}
.swatches .swatch:nth-child(9){animation-delay:180ms}
.swatches .swatch:nth-child(10){animation-delay:200ms}
.swatches .swatch:nth-child(11){animation-delay:220ms}

/* Semantic Row */
.semantic-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.semantic-card{padding:14px;border-radius:var(--radius-md);display:flex;flex-direction:column;gap:4px;
cursor:pointer;transition:transform 300ms cubic-bezier(0.34,1.56,0.64,1),box-shadow 300ms ease;
border:1px solid rgba(0,0,0,0.06);animation:swatchAppear 400ms cubic-bezier(0.34,1.56,0.64,1) both}
.semantic-card:hover{transform:scale(1.05) translateY(-2px);box-shadow:var(--shadow-md),0 0 20px currentColor}
.semantic-card:active{transform:scale(0.98)}
.semantic-card-label{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em}
.semantic-card-hex{font-size:0.65rem;font-family:var(--font-mono);opacity:0.7}

/* Bottom Grid */
.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:32px}

/* Preview Panel — Glassmorphism */
.preview-panel{background:var(--bg-surface);border:1px solid var(--border-color);
border-radius:var(--radius-lg);overflow:hidden;backdrop-filter:var(--glass-blur) var(--glass-saturate);
-webkit-backdrop-filter:var(--glass-blur) var(--glass-saturate);box-shadow:var(--shadow-md),var(--shadow-glow)}
.preview-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;
border-bottom:1px solid var(--border-color)}
.preview-header h3{font-size:0.85rem;font-weight:600}
.preview-mode-toggle{display:flex;border-radius:var(--radius-sm);overflow:hidden;
border:1px solid var(--border-color)}
.preview-mode-btn{padding:4px 12px;font-size:0.75rem;border:none;cursor:pointer;
font-family:var(--font-ui);font-weight:500;transition:all var(--transition-normal);
background:transparent;color:var(--text-secondary)}
.preview-mode-btn.active{background:var(--accent);color:#fff;box-shadow:0 0 10px rgba(167,139,250,0.25)}
.preview-mode-btn:hover:not(.active){background:var(--bg-surface-hover)}
.preview-content{padding:20px;overflow-y:auto;max-height:600px}

/* Preview Components */
.preview-surface{border-radius:var(--radius-md);padding:24px;transition:all var(--transition-normal)}
.preview-hero{margin-bottom:20px;padding:24px;border-radius:var(--radius-md)}
.preview-hero h2{font-size:1.4rem;font-weight:700;margin-bottom:8px}
.preview-hero p{font-size:0.85rem;opacity:0.8;margin-bottom:16px}
.preview-btn{padding:10px 20px;border-radius:var(--radius-sm);border:none;font-weight:600;
font-size:0.85rem;cursor:pointer;font-family:var(--font-ui);transition:opacity var(--transition-fast)}
.preview-btn:hover{opacity:0.85}
.preview-btn-outline{background:transparent;border:2px solid;padding:8px 18px}
.preview-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.preview-card{padding:16px;border-radius:var(--radius-md);border:1px solid}
.preview-card h4{font-size:0.85rem;font-weight:600;margin-bottom:4px}
.preview-card p{font-size:0.75rem;opacity:0.7}
.preview-form{display:flex;flex-direction:column;gap:10px}
.preview-input{padding:10px 12px;border-radius:var(--radius-sm);border:1px solid;
font-family:var(--font-ui);font-size:0.85rem;outline:none}
.preview-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.preview-badge{padding:4px 10px;border-radius:20px;font-size:0.7rem;font-weight:600}

/* Export Panel — Glassmorphism */
.export-panel{background:var(--bg-surface);border:1px solid var(--border-color);
border-radius:var(--radius-lg);overflow:hidden;backdrop-filter:var(--glass-blur) var(--glass-saturate);
-webkit-backdrop-filter:var(--glass-blur) var(--glass-saturate);box-shadow:var(--shadow-md),var(--shadow-glow);
display:flex;flex-direction:column}
.export-tabs{display:flex;border-bottom:1px solid var(--border-color)}
.export-tab{flex:1;padding:12px;text-align:center;font-size:0.8rem;font-weight:600;
cursor:pointer;border:none;background:transparent;color:var(--text-secondary);
font-family:var(--font-ui);transition:all var(--transition-normal);
border-bottom:2px solid transparent;position:relative}
.export-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-dim)}
.export-tab:hover{color:var(--text-primary);background:var(--bg-surface-hover)}
.export-body{flex:1;position:relative;display:flex;flex-direction:column}
.export-code{flex:1;padding:16px;overflow:auto;max-height:500px}
.export-code pre{font-family:var(--font-mono);font-size:0.75rem;line-height:1.6;
white-space:pre-wrap;word-break:break-all;color:var(--text-primary)}
.export-actions{position:sticky;bottom:0;display:flex;gap:0}
.export-copy-btn,.export-download-btn{flex:1;padding:12px;border:none;
background:var(--accent);color:#fff;font-weight:600;font-size:0.85rem;cursor:pointer;
font-family:var(--font-ui);transition:all 300ms cubic-bezier(0.4,0,0.2,1)}
.export-download-btn{background:var(--bg-elevated);color:var(--text-primary);
border-left:1px solid var(--border-color)}
.export-copy-btn:hover{background:var(--accent-hover);box-shadow:0 0 16px rgba(167,139,250,0.3)}
.export-download-btn:hover{background:var(--bg-surface-hover)}
.export-copy-btn.copied{background:var(--success)}

/* WCAG Section */
.wcag-section{margin-top:32px}
.wcag-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wcag-autofix-btn{padding:6px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-color);
background:var(--bg-surface);color:var(--text-primary);cursor:pointer;font-family:var(--font-ui);
font-size:0.75rem;font-weight:600;transition:all 300ms cubic-bezier(0.4,0,0.2,1)}
.wcag-autofix-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);
transform:translateY(-1px);box-shadow:0 0 16px rgba(167,139,250,0.3)}
.wcag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.wcag-card{padding:14px;border-radius:var(--radius-md);background:var(--bg-surface);
border:1px solid var(--border-color);display:flex;align-items:center;gap:12px;
backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
transition:transform var(--transition-fast),box-shadow var(--transition-fast)}
.wcag-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.wcag-preview{width:48px;height:48px;border-radius:var(--radius-sm);display:flex;
align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;flex-shrink:0}
.wcag-info{flex:1;min-width:0}
.wcag-pair{font-size:0.75rem;font-family:var(--font-mono);color:var(--text-secondary);
margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcag-ratio{font-size:0.85rem;font-weight:600;margin-bottom:2px}
.wcag-badges{display:flex;gap:4px}
.wcag-badge{font-size:0.6rem;font-weight:700;padding:2px 6px;border-radius:3px}
.wcag-pass{background:rgba(74,222,128,0.15);color:#4ade80}
.wcag-fail{background:rgba(248,113,113,0.15);color:#f87171}
.wcag-fixed{font-size:0.65rem;color:var(--success);margin-top:4px;font-weight:500}

/* Saved Palettes */
.saved-section{margin-top:32px}
.saved-grid{display:flex;flex-wrap:wrap;gap:8px}
.saved-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;
background:var(--bg-surface);border:1px solid var(--border-color);cursor:pointer;
transition:all 300ms cubic-bezier(0.4,0,0.2,1);font-size:0.8rem;color:var(--text-secondary);
backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.saved-chip:hover{background:var(--bg-surface-hover);color:var(--text-primary);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.saved-chip-swatch{width:14px;height:14px;border-radius:50%;flex-shrink:0;
border:1px solid rgba(0,0,0,0.1)}
.saved-chip-delete{width:16px;height:16px;border-radius:50%;border:none;background:transparent;
color:var(--text-tertiary);cursor:pointer;font-size:0.7rem;display:flex;align-items:center;
justify-content:center;transition:all var(--transition-fast)}
.saved-chip-delete:hover{background:var(--error);color:#fff}
.save-palette-btn{padding:8px 16px;border-radius:20px;border:1px dashed var(--border-color);
background:transparent;color:var(--text-tertiary);cursor:pointer;font-family:var(--font-ui);
font-size:0.8rem;transition:all var(--transition-fast)}
.save-palette-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Toast — Glassmorphism */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);
padding:12px 24px;border-radius:var(--radius-md);background:var(--accent);color:#fff;
font-size:0.85rem;font-weight:600;z-index:9999;transition:transform 400ms cubic-bezier(0.34,1.56,0.64,1);
pointer-events:none;box-shadow:var(--shadow-lg),0 0 30px rgba(167,139,250,0.3);
backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Responsive */
@media(max-width:1024px){
.bottom-grid{grid-template-columns:1fr}
}
@media(max-width:768px){
.header{padding:12px 16px}
.input-bar{padding:10px 16px}
.main{padding:16px}
.swatches{grid-template-columns:repeat(11,1fr);gap:2px}
.swatch-step,.swatch-hex{font-size:0.45rem}
.semantic-row{grid-template-columns:1fr 1fr}
.bottom-grid{grid-template-columns:1fr}
.preview-cards{grid-template-columns:1fr}
}
@media(max-width:480px){
.swatches{grid-template-columns:repeat(5,1fr);gap:3px}
.swatch{display:none}
.swatch[data-key-swatch]{display:flex}
.hex-input{width:100px}
.semantic-row{grid-template-columns:1fr 1fr}
}

/* Collapsible Sections — Progressive Disclosure */
.collapsible-header{display:flex;align-items:center;justify-content:space-between;
cursor:pointer;padding:14px 18px;user-select:none;border:1px solid var(--border-color);
background:var(--bg-surface);width:100%;border-radius:var(--radius-md);
color:var(--text-tertiary);font-size:0.75rem;font-weight:700;text-transform:uppercase;
letter-spacing:0.08em;font-family:var(--font-ui);transition:all 300ms cubic-bezier(0.4,0,0.2,1);margin-bottom:12px;
backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.collapsible-header:hover{color:var(--text-primary);background:var(--bg-surface-hover);border-color:var(--accent);
transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.collapsible-header[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-dim);box-shadow:var(--shadow-sm)}
.collapsible-header-left{display:flex;align-items:center;gap:8px}
.collapsible-hint{font-size:0.7rem;font-weight:500;color:var(--accent);padding:2px 8px;
border-radius:10px;background:var(--accent-dim);text-transform:none;letter-spacing:0}
.collapsible-hint.has-issues{background:rgba(248,113,113,0.15);color:var(--error)}
.collapsible-hint.all-pass{background:rgba(74,222,128,0.15);color:var(--success)}
.collapsible-chevron{display:inline-block;transition:transform 300ms ease;font-size:0.7rem;
color:var(--text-tertiary);margin-left:8px}
.collapsible-header[aria-expanded="true"] .collapsible-chevron{transform:rotate(180deg)}
.collapsible-content{max-height:0;overflow:hidden;transition:max-height 400ms ease}
.collapsible-content.expanded{max-height:2000px}

/* Section dividers for contrast */
.wcag-section,.saved-section,.history-section{margin-top:32px;padding-top:24px;border-top:1px solid var(--border-color)}

/* History Section */
.history-section{margin-top:32px;padding-top:24px;border-top:1px solid var(--border-color)}
.history-grid{display:flex;flex-wrap:wrap;gap:8px}
.history-item{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;
background:var(--bg-surface);border:1px solid var(--border-color);cursor:pointer;
transition:all 300ms cubic-bezier(0.4,0,0.2,1);font-size:0.8rem;color:var(--text-secondary)}
.history-item:hover{background:var(--bg-surface-hover);color:var(--text-primary);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.history-item-swatches{display:flex;gap:2px}
.history-item-swatch{width:14px;height:14px;border-radius:50%;flex-shrink:0;
border:1px solid rgba(0,0,0,0.1)}
.history-item-time{font-size:0.65rem;color:var(--text-tertiary);font-family:var(--font-mono)}
.history-clear-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border-color);
background:transparent;color:var(--text-tertiary);cursor:pointer;font-family:var(--font-ui);
font-size:0.75rem;transition:all var(--transition-fast)}
.history-clear-btn:hover{border-color:var(--error);color:var(--error)}

/* Copy CSS Button */
.copy-css-btn,.copy-tw-btn{background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-sm);
padding:8px 16px;color:var(--text-primary);cursor:pointer;font-size:0.8rem;font-weight:600;font-family:var(--font-ui);
transition:all 300ms cubic-bezier(0.4,0,0.2,1);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.copy-css-btn:hover,.copy-tw-btn:hover{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);
transform:translateY(-1px);box-shadow:var(--shadow-sm)}

/* Harmony Suggestions */
.harmony-suggestions{display:flex;align-items:center;gap:6px;padding:4px 0;flex-wrap:wrap}
.harmony-suggestions-label{font-size:0.65rem;color:var(--text-tertiary);font-weight:600;text-transform:uppercase;
letter-spacing:0.04em;white-space:nowrap}
.harmony-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid var(--border-color);
transition:all 300ms cubic-bezier(0.34,1.56,0.64,1);flex-shrink:0;position:relative}
.harmony-swatch:hover{transform:scale(1.25);box-shadow:0 0 12px currentColor;border-color:var(--text-secondary)}
.harmony-swatch:active{transform:scale(0.95)}
.harmony-swatch[data-active]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.harmony-swatch::after{content:attr(data-label);position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
font-size:0.55rem;color:var(--text-tertiary);white-space:nowrap;opacity:0;transition:opacity var(--transition-fast);
pointer-events:none}
.harmony-swatch:hover::after{opacity:1}

/* Color Blindness Preview */
.cb-toggle-wrap{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cb-btn{padding:5px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-color);
background:var(--bg-surface);color:var(--text-secondary);cursor:pointer;font-family:var(--font-ui);
font-size:0.75rem;font-weight:500;transition:all 300ms cubic-bezier(0.4,0,0.2,1)}
.cb-btn:hover{border-color:var(--accent);color:var(--text-primary);transform:translateY(-1px)}
.cb-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 12px rgba(167,139,250,0.3)}
.cb-label{font-size:0.75rem;color:var(--text-tertiary);font-weight:600;text-transform:uppercase;
letter-spacing:0.06em}

/* Print */
@media print{
  .header,.input-bar,.toast,.skip-to-content,.hero{display:none!important}
  .collapsible-content{max-height:none!important;overflow:visible!important}
  .main{padding:0}
  .swatch{border:1px solid #ccc!important}
  .wcag-autofix-btn,.save-palette-btn,.saved-chip-delete,.export-actions,
  .preview-mode-toggle,.share-btn,.theme-toggle,.random-btn,.copy-css-btn,.copy-tw-btn,
  .history-clear-btn,.cb-toggle-wrap,.harmony-suggestions{display:none!important}
  body{background:#fff!important;color:#000!important}
  .section-title,.collapsible-header{color:#333!important}
}
/* Focus styles */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

<script>
(function(){'use strict';

// ============================================================
// PWA: Inline Service Worker + Web App Manifest
// ============================================================

// Register external Service Worker (blob: URLs cause SecurityError)
(function registerSW(){
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.register('./sw.js').catch(function(){});
})();

// Static manifest.json is linked in <head>

// ============================================================
// COLOR MATH: HEX <-> sRGB <-> Linear RGB <-> XYZ <-> Oklab <-> OKLCH
// ============================================================

function hexToRgb(hex){
  hex=hex.replace('#','');
  if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  var n=parseInt(hex,16);
  return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];
}

function rgbToHex(rgb){
  return '#'+rgb.map(function(c){
    c=Math.max(0,Math.min(1,c));
    var h=Math.round(c*255).toString(16);
    return h.length===1?'0'+h:h;
  }).join('');
}

function srgbToLinear(c){
  return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);
}

function linearToSrgb(c){
  return c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055;
}

function linearRgbToXyz(r,g,b){
  return[
    0.4122214708*r+0.5363325363*g+0.0514459929*b,
    0.2119034982*r+0.6806995451*g+0.1073969566*b,
    0.0883024619*r+0.2817188376*g+0.6299787005*b
  ];
}

function xyzToLinearRgb(x,y,z){
  return[
    3.2409699419*x-1.5373831776*y-0.4986107603*z,
   -0.9692436363*x+1.8759675015*y+0.0415550574*z,
    0.0556300797*x-0.2039769589*y+1.0569715142*z
  ];
}

function xyzToOklab(x,y,z){
  var l_=Math.cbrt(0.8189330101*x+0.3618667424*y-0.1288597137*z);
  var m_=Math.cbrt(0.0329845436*x+0.9293118715*y+0.0361456387*z);
  var s_=Math.cbrt(0.0482003018*x+0.2643662691*y+0.6338517070*z);
  return[
    0.2104542553*l_+0.7936177850*m_-0.0040720468*s_,
    1.9779984951*l_-2.4285922050*m_+0.4505937099*s_,
    0.0259040371*l_+0.7827717662*m_-0.8086757660*s_
  ];
}

function oklabToXyz(L,a,b){
  var l_=L+0.3963377774*a+0.2158037573*b;
  var m_=L-0.1055613458*a-0.0638541728*b;
  var s_=L-0.0894841775*a-1.2914855480*b;
  var l=l_*l_*l_,m=m_*m_*m_,s=s_*s_*s_;
  return[
    1.2270138511*l-0.5577999807*m+0.2812561490*s,
   -0.0405801784*l+1.1122568696*m-0.0716766787*s,
   -0.0763812845*l-0.4214819784*m+1.5861632204*s
  ];
}

function oklabToOklch(L,a,b){
  var C=Math.sqrt(a*a+b*b);
  var h=Math.atan2(b,a)*180/Math.PI;
  if(h<0)h+=360;
  return[L,C,h];
}

function oklchToOklab(L,C,h){
  var hr=h*Math.PI/180;
  return[L,C*Math.cos(hr),C*Math.sin(hr)];
}

function hexToOklch(hex){
  var rgb=hexToRgb(hex);
  var lr=srgbToLinear(rgb[0]),lg=srgbToLinear(rgb[1]),lb=srgbToLinear(rgb[2]);
  var xyz=linearRgbToXyz(lr,lg,lb);
  var lab=xyzToOklab(xyz[0],xyz[1],xyz[2]);
  return oklabToOklch(lab[0],lab[1],lab[2]);
}

function oklchToHex(L,C,h){
  var lab=oklchToOklab(L,C,h);
  var xyz=oklabToXyz(lab[0],lab[1],lab[2]);
  var lrgb=xyzToLinearRgb(xyz[0],xyz[1],xyz[2]);
  var srgb=[linearToSrgb(lrgb[0]),linearToSrgb(lrgb[1]),linearToSrgb(lrgb[2])];
  // Gamut clamp
  srgb=srgb.map(function(c){return Math.max(0,Math.min(1,c));});
  return rgbToHex(srgb);
}

function isInGamut(L,C,h){
  var lab=oklchToOklab(L,C,h);
  var xyz=oklabToXyz(lab[0],lab[1],lab[2]);
  var lrgb=xyzToLinearRgb(xyz[0],xyz[1],xyz[2]);
  var srgb=[linearToSrgb(lrgb[0]),linearToSrgb(lrgb[1]),linearToSrgb(lrgb[2])];
  return srgb.every(function(c){return c>=-0.002&&c<=1.002;});
}

function clampChroma(L,C,h){
  if(isInGamut(L,C,h))return C;
  var lo=0,hi=C;
  for(var i=0;i<20;i++){
    var mid=(lo+hi)/2;
    if(isInGamut(L,mid,h))lo=mid;else hi=mid;
  }
  return lo;
}

// ============================================================
// PALETTE GENERATION
// ============================================================

var STEPS=[50,100,200,300,400,500,600,700,800,900,950];
var LIGHTNESS_MAP={50:0.97,100:0.93,200:0.87,300:0.78,400:0.68,500:0.57,
  600:0.48,700:0.39,800:0.30,900:0.22,950:0.15};

function generateScale(baseOklch,label){
  var bL=baseOklch[0],bC=baseOklch[1],bH=baseOklch[2];
  var colors=[];
  STEPS.forEach(function(step){
    var targetL=LIGHTNESS_MAP[step];
    // Scale chroma: reduce at extremes
    var chromaScale=1-Math.pow(Math.abs(targetL-0.55)/0.55,1.5)*0.6;
    chromaScale=Math.max(0.15,chromaScale);
    var C=bC*chromaScale;
    C=clampChroma(targetL,C,bH);
    var hex=oklchToHex(targetL,C,bH);
    colors.push({step:step,hex:hex,L:targetL,C:C,H:bH});
  });
  return{label:label,colors:colors,baseHex:colors[5].hex};
}

function getHarmonyHues(h,mode){
  switch(mode){
    case 'complementary':return[(h+180)%360];
    case 'analogous':return[(h+30)%360,(h+330)%360];
    case 'triadic':return[(h+120)%360,(h+240)%360];
    case 'split':return[(h+150)%360,(h+210)%360];
    default:return[(h+180)%360];
  }
}

function generateSemanticColors(baseH){
  // Success = green area, Warning = yellow/orange, Error = red, Info = blue
  function make(targetH,targetC,targetL){
    var C=clampChroma(targetL,targetC,targetH);
    return oklchToHex(targetL,C,targetH);
  }
  return{
    success:{hex:make(145,0.16,0.60),label:'Success'},
    warning:{hex:make(75,0.16,0.75),label:'Warning'},
    error:{hex:make(25,0.18,0.55),label:'Error'},
    info:{hex:make(250,0.14,0.60),label:'Info'}
  };
}

function generateFullPalette(hex,harmony){
  var oklch=hexToOklch(hex);
  var L=oklch[0],C=oklch[1],H=oklch[2];

  // Primary
  var primary=generateScale([L,C,H],'Primary');

  // Secondary + Accent from harmony
  var hues=getHarmonyHues(H,harmony);
  var secondary=generateScale([L,C,hues[0]],'Secondary');
  var accent=hues.length>1?generateScale([L,C,hues[1]],'Accent'):
    generateScale([L,C,(H+90)%360],'Accent');

  // Neutral: desaturated primary
  var neutral=generateScale([L,C*0.08,H],'Neutral');

  // Semantic
  var semantic=generateSemanticColors(H);

  return{primary:primary,secondary:secondary,accent:accent,neutral:neutral,semantic:semantic};
}

// ============================================================
// WCAG CONTRAST
// ============================================================

function relativeLuminance(hex){
  var rgb=hexToRgb(hex);
  var vals=rgb.map(function(c){return srgbToLinear(c);});
  return 0.2126*vals[0]+0.7152*vals[1]+0.0722*vals[2];
}

function contrastRatio(hex1,hex2){
  var l1=relativeLuminance(hex1);
  var l2=relativeLuminance(hex2);
  var lighter=Math.max(l1,l2);
  var darker=Math.min(l1,l2);
  return(lighter+0.05)/(darker+0.05);
}

function wcagLevel(ratio){
  if(ratio>=7)return'AAA';
  if(ratio>=4.5)return'AA';
  if(ratio>=3)return'AA Large';
  return'Fail';
}

// WCAG Auto-fix: binary search OKLCH lightness for fg to achieve >= 4.5:1 against bg
function autofixContrast(bgHex,fgHex){
  var ratio=contrastRatio(bgHex,fgHex);
  if(ratio>=4.5)return null; // already passes
  var bgLum=relativeLuminance(bgHex);
  var fgOklch=hexToOklch(fgHex);
  var fgC=fgOklch[1],fgH=fgOklch[2];
  // Decide direction: if bg is dark, make fg lighter; if bg is light, make fg darker
  var goLighter=bgLum<0.5;
  var lo,hi;
  if(goLighter){lo=fgOklch[0];hi=1.0;}
  else{lo=0;hi=fgOklch[0];}
  var fixedHex=fgHex;
  for(var i=0;i<30;i++){
    var mid=(lo+hi)/2;
    var cClamped=clampChroma(mid,fgC,fgH);
    var candidate=oklchToHex(mid,cClamped,fgH);
    var r=contrastRatio(bgHex,candidate);
    if(r>=4.5){
      fixedHex=candidate;
      if(goLighter)hi=mid;else lo=mid;
    }else{
      if(goLighter)lo=mid;else hi=mid;
    }
  }
  return fixedHex;
}

// Load from URL hash
function loadFromUrl(){
  var hash=window.location.hash.replace('#','');
  if(!hash)return;
  var params={};
  hash.split('&').forEach(function(p){var kv=p.split('=');if(kv.length===2)params[kv[0]]=kv[1];});
  if(params.c&&/^[0-9a-fA-F]{6}$/.test(params.c))state.hex='#'+params.c;
  if(params.h&&['complementary','analogous','triadic','split'].indexOf(params.h)!==-1)state.harmony=params.h;
}

function saveToUrl(){
  var hex=state.hex.replace('#','');
  window.history.replaceState(null,'','#c='+hex+'&h='+state.harmony);
}

function escapeHtml(str){

function showToast(msg){

function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){showToast('Copied!');});
  }else{
    var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';
    ta.style.left='-9999px';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');showToast('Copied!');}catch(e){}
    document.body.removeChild(ta);
  }
}

function generateCssExport(){
  var p=state.palette;var lines=[':root {'];
  function addScale(scale,prefix){
    scale.colors.forEach(function(c){
      lines.push('  --'+prefix+'-'+c.step+': '+c.hex+'; /* '+hexToOklchStr(c.hex)+' */');
    });
  }
  addScale(p.primary,'color-primary');
  addScale(p.secondary,'color-secondary');
  addScale(p.accent,'color-accent');
  addScale(p.neutral,'color-neutral');
  lines.push('');
  lines.push('  /* Semantic */');
  Object.keys(p.semantic).forEach(function(k){
    lines.push('  --color-'+k+': '+p.semantic[k].hex+'; /* '+hexToOklchStr(p.semantic[k].hex)+' */');
  });
  lines.push('');
  lines.push('  /* Light mode surfaces */');
  lines.push('  --surface-bg: '+p.neutral.colors[0].hex+';');
  lines.push('  --surface-card: #ffffff;');
  lines.push('  --text-primary: '+p.neutral.colors[9].hex+';');
  lines.push('  --text-secondary: '+p.neutral.colors[7].hex+';');
  lines.push('}');
  lines.push('');
  lines.push('@media (prefers-color-scheme: dark) {');
  lines.push('  :root {');
  lines.push('    --surface-bg: '+p.neutral.colors[9].hex+';');
  lines.push('    --surface-card: '+p.neutral.colors[8].hex+';');
  lines.push('    --text-primary: '+p.neutral.colors[1].hex+';');
  lines.push('    --text-secondary: '+p.neutral.colors[3].hex+';');
  lines.push('  }');
  lines.push('}');
  return lines.join('\n');
}

function generateTailwindExport(){
  var p=state.palette;var lines=['@theme {'];
  function addScale(scale,prefix){
    scale.colors.forEach(function(c){
      lines.push('  --color-'+prefix+'-'+c.step+': '+c.hex+';');
    });
  }
  addScale(p.primary,'primary');
  addScale(p.secondary,'secondary');
  addScale(p.accent,'accent');
  addScale(p.neutral,'neutral');
  lines.push('');
  Object.keys(p.semantic).forEach(function(k){
    lines.push('  --color-'+k+': '+p.semantic[k].hex+';');
  });
  lines.push('}');
  return lines.join('\n');
}

function generateJsonExport(){
  var p=state.palette;var tokens={};
  function addScale(scale,name){
    tokens[name]={};
    scale.colors.forEach(function(c){
      tokens[name][c.step]={$value:c.hex,$type:'color'};
    });
  }
  addScale(p.primary,'primary');
  addScale(p.secondary,'secondary');
  addScale(p.accent,'accent');
  addScale(p.neutral,'neutral');
  tokens.semantic={};
  Object.keys(p.semantic).forEach(function(k){
    tokens.semantic[k]={$value:p.semantic[k].hex,$type:'color'};
  });
  tokens.surface={light:{bg:{$value:p.neutral.colors[0].hex,$type:'color'},
    card:{$value:'#ffffff',$type:'color'},textPrimary:{$value:p.neutral.colors[9].hex,$type:'color'},
    textSecondary:{$value:p.neutral.colors[7].hex,$type:'color'}},
    dark:{bg:{$value:p.neutral.colors[9].hex,$type:'color'},

    textSecondary:{$value:p.neutral.colors[3].hex,$type:'color'}}};
  return JSON.stringify(tokens,null,2);
}

function setupTablistKeys(selector){
  var tablist=document.querySelector(selector);
  if(!tablist)return;
  tablist.addEventListener('keydown',function(e){
    if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
    var tabs=Array.prototype.slice.call(tablist.querySelectorAll('[role="tab"]'));
    var current=tabs.indexOf(document.activeElement);
    if(current===-1)return;
    e.preventDefault();
    var next;
    if(e.key==='ArrowRight')next=(current+1)%tabs.length;
    else next=(current-1+tabs.length)%tabs.length;
    tabs[current].setAttribute('tabindex','-1');
    tabs[next].setAttribute('tabindex','0');
    tabs[next].focus();
    tabs[next].click();
  });
}

// WCAG Auto-fix: apply fixes back into state.palette so exports reflect them
function applyWcagFixesToPalette(fixes){
  var p=state.palette;
  var pri=p.primary.colors;
  var neu=p.neutral.colors;
  // Map WCAG pair index -> palette entry (fg side)
  // 0: pri[5], 1: neu[9], 2: #fff (skip), 3: neu[9], 4: pri[6],
  // 5: neu[1], 6: pri[4], 7: neu[1], 8: #fff (skip), 9: #fff (skip)
  var map={0:pri[5],1:neu[9],3:neu[9],4:pri[6],5:neu[1],6:pri[4],7:neu[1]};
  Object.keys(fixes).forEach(function(idx){
    var entry=map[idx];
    if(entry) entry.hex=fixes[idx];
  });
  // Also update semantic if pairs 8/9 had fixes (fg=#fff, not in palette — skip)
}

// ============================================================
// SHARE CARD (Canvas PNG 1200x630)
// ============================================================

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();ctx.fill();
}

function generateShareCard(){
  var p=state.palette;
  var canvas=document.createElement('canvas');
  canvas.width=1200;canvas.height=630;
  var ctx=canvas.getContext('2d');

  // Background
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(0,0,1200,630);

  // 4 palette strips
  var scales=[p.primary,p.secondary,p.accent,p.neutral];
  var stripHeight=80;var startY=60;var stripGap=12;
  scales.forEach(function(scale,i){
    var y=startY+i*(stripHeight+stripGap);
    scale.colors.forEach(function(c,j){
      var x=40+j*(1120/11);
      var w=1120/11-4;
      ctx.fillStyle=c.hex;
      roundRect(ctx,x,y,w,stripHeight,8);
    });
  });

  // Branding
  ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.font='700 32px system-ui,sans-serif';
  ctx.textAlign='left';
  ctx.fillText('DualTone',40,500);

  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.font='400 18px system-ui,sans-serif';
  ctx.fillText('One color in. Full system out.',40,535);

  // HEX + harmony
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.font='500 20px monospace';
  ctx.textAlign='right';
  ctx.fillText(state.hex+'  '+state.harmony,1160,505);

  return canvas;
}

function downloadShareCard(){
  var canvas=generateShareCard();
  if(!canvas.toBlob){
    var dataUrl=canvas.toDataURL('image/png');
    var a=document.createElement('a');
    a.href=dataUrl;a.download='dualtone-palette.png';
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);
    showToast('Card downloaded!');
    return;
  }
  canvas.toBlob(function(blob){
    if(!blob)return;
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='dualtone-palette.png';
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Card downloaded!');
  },'image/png');
}

function shareWithWebShareAPI(){
  var canvas=generateShareCard();
  if(!canvas.toBlob){
    downloadShareCard();
    return;
  }
  canvas.toBlob(function(blob){
    if(!blob)return;
    if(navigator.share&&navigator.canShare){
      var file=new File([blob],'dualtone-palette.png',{type:'image/png'});
      var data={title:'DualTone Palette',text:state.hex+' '+state.harmony,files:[file]};
      if(navigator.canShare(data)){
        navigator.share(data).catch(function(){});
        return;
      }
    }
    // Fallback: download
    downloadShareCard();
  },'image/png');
}

// FEATURE: PALETTE HISTORY (localStorage dt_history, last 10)
// ============================================================

var historyMax=10;

function loadHistory(){
  try{var h=localStorage.getItem('dt_history');
  return h?JSON.parse(h):[];}catch(e){return[];}
}

function saveHistory(history){
  try{localStorage.setItem('dt_history',JSON.stringify(history));}catch(e){}
}

function addToHistory(hex,harmony){
  var history=loadHistory();
  // Don't duplicate the last entry
  if(history.length>0&&history[0].colors[0]===hex&&history[0].harmony===harmony)return;
  var p=generateFullPalette(hex,harmony);
  var entry={
    colors:[p.primary.colors[5].hex,p.secondary.colors[5].hex],
    harmony:harmony,
    timestamp:Date.now()
  };
  history.unshift(entry);
  if(history.length>historyMax)history=history.slice(0,historyMax);
  saveHistory(history);
}

function renderHistory(){
  var grid=$('historyGrid');
  if(!grid)return;
  grid.innerHTML='';
  var history=loadHistory();

  // Badge
  var hint=$('hintHistory');
  if(hint){
    if(history.length>0){hint.textContent=history.length+' recent';hint.style.display='';}
    else{hint.style.display='none';}
  }

  if(history.length===0){
    grid.innerHTML='<span style="font-size:0.8rem;color:var(--text-tertiary)">No history yet</span>';
    return;
  }

  history.forEach(function(entry){
    var item=document.createElement('div');
    item.className='history-item';
    item.setAttribute('role','button');
    item.setAttribute('tabindex','0');
    var ago=formatTimeAgo(entry.timestamp);
    item.innerHTML='<div class="history-item-swatches">'+
      '<div class="history-item-swatch" style="background:'+escapeHtml(entry.colors[0])+'"></div>'+
      '<div class="history-item-swatch" style="background:'+escapeHtml(entry.colors[1])+'"></div>'+
      '</div><span>'+escapeHtml(entry.colors[0])+'</span><span class="history-item-time">'+escapeHtml(ago)+'</span>';
    item.addEventListener('click',function(){
      state.hex=entry.colors[0];
      state.harmony=entry.harmony||'complementary';
      updateAll();
      showToast('Loaded palette');
    });
    item.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();item.click();}});
    grid.appendChild(item);
  });

  var clearBtn=document.createElement('button');
  clearBtn.className='history-clear-btn';
  clearBtn.textContent='Clear History';
  clearBtn.addEventListener('click',function(){
    try{localStorage.removeItem('dt_history');}catch(e){}
    renderHistory();
    showToast('History cleared');
  });
  grid.appendChild(clearBtn);
}

function formatTimeAgo(ts){
  var diff=Date.now()-ts;
  var sec=Math.floor(diff/1000);
  if(sec<60)return 'just now';
  var min=Math.floor(sec/60);
  if(min<60)return min+'m ago';
  var hr=Math.floor(min/60);
  if(hr<24)return hr+'h ago';
  var d=Math.floor(hr/24);
  return d+'d ago';
}

function renderHarmonySuggestions(){
  var container=$('harmonySuggestions');
  if(!container)return;
  container.innerHTML='';
  var oklch=hexToOklch(state.hex);
  var H=oklch[2],L=oklch[0],C=oklch[1];

  // Build suggestion list: complementary, analogous pair, triadic pair
  var suggestions=[];
  var compH=(H+180)%360;
  suggestions.push({hex:oklchToHex(L,clampChroma(L,C,compH),compH),label:'Compl.'});
  var ana1H=(H+30)%360,ana2H=(H+330)%360;
  suggestions.push({hex:oklchToHex(L,clampChroma(L,C,ana1H),ana1H),label:'Analog 1'});
  suggestions.push({hex:oklchToHex(L,clampChroma(L,C,ana2H),ana2H),label:'Analog 2'});
  var tri1H=(H+120)%360,tri2H=(H+240)%360;
  suggestions.push({hex:oklchToHex(L,clampChroma(L,C,tri1H),tri1H),label:'Triad 1'});
  suggestions.push({hex:oklchToHex(L,clampChroma(L,C,tri2H),tri2H),label:'Triad 2'});

  var lbl=document.createElement('span');
  lbl.className='harmony-suggestions-label';
  lbl.textContent='Harmonies:';
  container.appendChild(lbl);

  // Current color swatch
  var curSw=document.createElement('div');
  curSw.className='harmony-swatch';
  curSw.style.background=state.hex;
  curSw.setAttribute('data-active','');
  curSw.setAttribute('data-label','Current');
  curSw.setAttribute('title','Current: '+state.hex);
  curSw.setAttribute('role','button');
  curSw.setAttribute('tabindex','0');
  container.appendChild(curSw);

  suggestions.forEach(function(s){
    var sw=document.createElement('div');
    sw.className='harmony-swatch';
    sw.style.background=s.hex;
    sw.setAttribute('data-label',s.label);
    sw.setAttribute('title',s.label+': '+s.hex);

    });
    sw.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();sw.click();}});
    container.appendChild(sw);
  });
}

    });
  }else{
    fallbackCopy(tw,'Copied Tailwind config!');
  }
});

function fallbackCopy(text,msg){
  var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';
  ta.style.left='-9999px';document.body.appendChild(ta);ta.select();
  try{var ok=document.execCommand('copy');if(ok)showToast(msg||'Copied!');}catch(e){}
  document.body.removeChild(ta);
}

// ============================================================
// FEATURE: COLOR BLINDNESS PREVIEW
// ============================================================

var cbMode='normal';

var cbBtns=Array.from(document.querySelectorAll('.cb-btn'));
function activateCbBtn(btn){
  cbBtns.forEach(function(b){b.classList.remove('active');b.setAttribute('aria-checked','false');b.setAttribute('tabindex','-1');});
  btn.classList.add('active');btn.setAttribute('aria-checked','true');btn.setAttribute('tabindex','0');btn.focus();
  cbMode=btn.getAttribute('data-cb');
  applyCbFilter();
}
cbBtns.forEach(function(btn){
  btn.addEventListener('click',function(){activateCbBtn(btn);});
});
var cbGroup=document.querySelector('[role="radiogroup"]');
if(cbGroup){cbGroup.addEventListener('keydown',function(e){
  var idx=cbBtns.indexOf(document.activeElement);if(idx<0)return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();activateCbBtn(cbBtns[(idx+1)%cbBtns.length]);}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();activateCbBtn(cbBtns[(idx-1+cbBtns.length)%cbBtns.length]);}
  else if(e.key==='Home'){e.preventDefault();activateCbBtn(cbBtns[0]);}
  else if(e.key==='End'){e.preventDefault();activateCbBtn(cbBtns[cbBtns.length-1]);}
});}

function applyCbFilter(){
  var targets=document.querySelectorAll('.palette-section, .semantic-row, .preview-content');
  var filterVal='none';
  if(cbMode==='protanopia')filterVal='url(#cbProtanopia)';
  else if(cbMode==='deuteranopia')filterVal='url(#cbDeuteranopia)';
  else if(cbMode==='tritanopia')filterVal='url(#cbTritanopia)';
  targets.forEach(function(el){el.style.filter=filterVal;});
}

// Setup history collapsible
setupCollapsible('historyToggle','historyContent');

loadAppTheme();
applyAppTheme();
loadSaved();
loadFromUrl();
updateAll();
initHeroVisual();
renderHistory();
// If URL has color params, collapse hero immediately
if(window.location.hash&&window.location.hash.indexOf('c=')!==-1){collapseHero();}

})();
